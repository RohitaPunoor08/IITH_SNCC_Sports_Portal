<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Hyderabad - SNCC Multi-Sport Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --iith-navy: #00188F;
            --iith-red: #E50C0C;
            --iith-orange: #FF7B00;
            --iith-yellow: #FFC000;
            --iith-light-bg: #F4F6F9;
            --iith-card: #FFFFFF;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--iith-light-bg);
            color: #333;
            min-height: 100vh;
        }

        header {
            background-color: var(--iith-navy);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-brand img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .header-title h1 { font-size: 18px; font-weight: 700; }
        .header-title p { font-size: 13px; color: var(--iith-yellow); }
        .sports-icons-bar { font-size: 20px; letter-spacing: 4px; }

        .tri-stripe { display: flex; height: 5px; width: 100%; }
        .tri-stripe .stripe-red { background-color: var(--iith-red); flex: 1; }
        .tri-stripe .stripe-orange { background-color: var(--iith-orange); flex: 1; }
        .tri-stripe .stripe-yellow { background-color: var(--iith-yellow); flex: 1; }

        .tabs-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            background-color: white;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            color: var(--iith-navy);
            border-bottom: 3px solid var(--iith-navy);
        }

        .tab-content { display: none; padding: 20px 0; flex-direction: column; gap: 15px; }
        .tab-content.active { display: flex; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .section-title { font-size: 14px; font-weight: bold; color: var(--iith-navy); }

        .card {
            background-color: var(--iith-card);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #FAFAFA; color: var(--iith-navy); font-weight: bold; padding: 12px; border-bottom: 1px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); }

        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .form-group { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: 600; color: var(--iith-navy); }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-navy { background-color: var(--iith-navy); color: white; }
        .btn-red { background-color: var(--iith-red); color: white; width: 100%; }
        .btn-full { width: 100%; }

        #snackbar {
            visibility: hidden;
            min-width: 250px;
            background-color: #2e7d32;
            color: white;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        #snackbar.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img src="https://www.iith.ac.in/assets/images/logo.png" alt="IITH Logo" onerror="this.outerHTML='🏛️'">
            <div class="header-title">
                <h1>IIT HYDERABAD</h1>
                <p>SNCC Multi-Sport Recreation Portal</p>
            </div>
        </div>
        <div class="sports-icons-bar">🏸 🏀 🏐 🎯 ♟️ ⚽</div>
    </header>

    <div class="tri-stripe">
        <div class="stripe-red"></div>
        <div class="stripe-orange"></div>
        <div class="stripe-yellow"></div>
    </div>

    <div class="tabs-container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('student-tab', this)">👥 Student View & Queue</button>
            <button class="tab-btn" onclick="switchTab('staff-tab', this)">⚙️ Staff Portal</button>
        </div>

        <div id="student-tab" class="tab-content active">
            <div class="section-header">
                <span class="section-title">Current Facilities Availability</span>
                <select id="filter-sport" style="width: 220px;" onchange="renderTables()">
                    <option value="ALL">All Sports</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Sport</th>
                            <th>Facility / Court</th>
                            <th>Status</th>
                            <th>Waiting in Queue</th>
                        </tr>
                    </thead>
                    <tbody id="court-table-body"></tbody>
                </table>
            </div>

            <span class="section-title">Live Waiting Queue</span>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Pos #</th>
                            <th>Sport</th>
                            <th>Facility</th>
                            <th>Student Name</th>
                            <th>Roll Number</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body"></tbody>
                </table>
            </div>

            <div class="card">
                <span class="section-title" style="display: block; margin-bottom: 10px;">➕ Join Sport Waiting Queue</span>
                <div class="form-row">
                    <div class="form-group"><input type="text" id="student-name" placeholder="Student Name"></div>
                    <div class="form-group"><input type="text" id="student-roll" placeholder="Roll Number"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><select id="student-sport" onchange="updateCourtDropdown('student-sport', 'student-court')"></select></div>
                    <div class="form-group"><select id="student-court"></select></div>
                    <button class="btn btn-navy" style="flex: 1; min-width: 140px;" onclick="joinQueue()">Join Queue</button>
                </div>
            </div>

            <button class="btn btn-red" onclick="fetchData()">🔄 Refresh Status & Queue</button>
        </div>

        <div id="staff-tab" class="tab-content">
            <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group">
                    <label>Staff ID Authentication</label>
                    <input type="password" id="staff-id" placeholder="Enter Staff ID">
                </div>
                <div class="form-group">
                    <label>Select Sport</label>
                    <select id="staff-sport" onchange="updateCourtDropdown('staff-sport', 'staff-court')"></select>
                </div>
                <div class="form-group">
                    <label>Select Facility / Court / Table Number</label>
                    <select id="staff-court"></select>
                </div>
                <div class="form-group">
                    <label>Update Availability Status</label>
                    <select id="status-update">
                        <option value="EMPTY">EMPTY</option>
                        <option value="FULL" selected>FULL</option>
                        <option value="MAINTENANCE">MAINTENANCE</option>
                        <option value="OFFICIAL MATCH">OFFICIAL MATCH</option>
                        <option value="NSO Practice">NSO Practice</option>
                        <option value="Inter-IIT Practice">Inter-IIT Practice</option>
                    </select>
                </div>
                <button class="btn btn-red btn-full" onclick="updateCourtStatus()">Submit Status Update</button>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">
                <button class="btn btn-navy btn-full" onclick="admitNextInQueue()">▶ Admit Next Student in Queue</button>
            </div>
        </div>
    </div>

    <div id="snackbar">Notification Message</div>

    <script>
        const SUPABASE_URL = "https://jxdpcevgtdaxenqeqdhv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZHBjZXZndGRheGVucWVxZGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDk2MDQsImV4cCI6MjEwNTk4NTYwNH0.szdIjCRGursiHZigx17PZmwgx76MGqvfCsuff7zF3nE";
        
        let db = null;
        if (SUPABASE_URL !== "https://jxdpcevgtdaxenqeqdhv.supabase.co") {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const SPORTS_CONFIG = {
            "Badminton": { count: 4, icon: "🏸", unit: "Court" },
            "Basketball": { count: 2, icon: "🏀", unit: "Court" },
            "Volleyball": { count: 2, icon: "🏐", unit: "Court" },
            "Carrom": { count: 3, icon: "🎯", unit: "Table" },
            "Chess": { count: 3, icon: "♟️", unit: "Table" },
            "Foosball": { count: 1, icon: "⚽", unit: "Table" }
        };

        const STATUS_COLORS = {
            "EMPTY": "#28A745", "FULL": "#DC3545", "MAINTENANCE": "#FF7B00",
            "OFFICIAL MATCH": "#8E44AD", "NSO Practice": "#00A8CC", "Inter-IIT Practice": "#00188F"
        };

        let facilities = [];
        let queue = [];

        function getDefaultFacilities() {
            let defaultList = [];
            for (let sport in SPORTS_CONFIG) {
                for (let i = 1; i <= SPORTS_CONFIG[sport].count; i++) {
                    defaultList.push({ sport_name: sport, court_no: i, availability: 'EMPTY' });
                }
            }
            return defaultList;
        }

        function populateSportDropdowns() {
            const filter = document.getElementById('filter-sport');
            const studentSport = document.getElementById('student-sport');
            const staffSport = document.getElementById('staff-sport');

            for (let sport in SPORTS_CONFIG) {
                const icon = SPORTS_CONFIG[sport].icon;
                filter.add(new Option(`${icon} ${sport}`, sport));
                studentSport.add(new Option(`${icon} ${sport}`, sport));
                staffSport.add(new Option(`${icon} ${sport}`, sport));
            }
            updateCourtDropdown('student-sport', 'student-court');
            updateCourtDropdown('staff-sport', 'staff-court');
        }

        function updateCourtDropdown(sportSelectId, courtSelectId) {
            const sport = document.getElementById(sportSelectId).value;
            const courtSelect = document.getElementById(courtSelectId);
            const cfg = SPORTS_CONFIG[sport];
            courtSelect.innerHTML = '';
            for (let i = 1; i <= cfg.count; i++) {
                courtSelect.add(new Option(`${cfg.unit} ${i}`, i));
            }
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("snackbar");
            toast.innerText = message;
            toast.style.backgroundColor = isError ? "var(--iith-red)" : "#2e7d32";
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function fetchData() {
            if (!db) {
                facilities = getDefaultFacilities();
                renderTables();
                return;
            }

            const { data: facData, error: facErr } = await db.from('sports_facilities').select('*');
            const { data: qData, error: qErr } = await db.from('court_queue').select('*').order('created_at', { ascending: true });

            if (!facErr && facData && facData.length > 0) {
                facilities = facData;
            } else {
                facilities = getDefaultFacilities();
            }

            if (!qErr && qData) {
                queue = qData;
            }

            renderTables();
        }

        function renderTables() {
            const selectedFilter = document.getElementById('filter-sport').value;
            const courtTbody = document.getElementById('court-table-body');
            const queueTbody = document.getElementById('queue-table-body');

            courtTbody.innerHTML = '';
            queueTbody.innerHTML = '';

            facilities.filter(f => selectedFilter === 'ALL' || f.sport_name === selectedFilter)
                .forEach(f => {
                    const cfg = SPORTS_CONFIG[f.sport_name];
                    const qCount = queue.filter(q => q.sport_name === f.sport_name && q.court_no == f.court_no).length;
                    const qText = qCount > 0 ? `${qCount} Waiting` : 'No Queue';
                    const color = STATUS_COLORS[f.availability] || 'var(--iith-navy)';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${cfg ? cfg.icon : ''} ${f.sport_name}</td>
                        <td><b>${cfg ? cfg.unit : 'Court'} ${f.court_no}</b></td>
                        <td style="color: ${color}; font-weight: bold;">${f.availability}</td>
                        <td>${qText}</td>
                    `;
                    courtTbody.appendChild(tr);
                });

            let pos = 1;
            queue.filter(q => selectedFilter === 'ALL' || q.sport_name === selectedFilter)
                .forEach(q => {
                    const cfg = SPORTS_CONFIG[q.sport_name];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${pos++}</td>
                        <td>${cfg ? cfg.icon : ''} ${q.sport_name}</td>
                        <td>${cfg ? cfg.unit : 'Court'} ${q.court_no}</td>
                        <td><b>${q.student_name}</b></td>
                        <td>${q.roll_no}</td>
                    `;
                    queueTbody.appendChild(tr);
                });
        }

        async function joinQueue() {
            const name = document.getElementById('student-name').value.trim();
            const roll = document.getElementById('student-roll').value.trim();
            const sport = document.getElementById('student-sport').value;
            const court = parseInt(document.getElementById('student-court').value);

            if (!name || !roll) {
                showToast("Please enter both Name and Roll Number!", true);
                return;
            }

            if (db) {
                const { error } = await db.from('court_queue').insert([
                    { student_name: name, roll_no: roll, sport_name: sport, court_no: court }
                ]);
                if (error) {
                    showToast("Error joining queue: " + error.message, true);
                    return;
                }
            } else {
                queue.push({ student_name: name, roll_no: roll, sport_name: sport, court_no: court });
                renderTables();
            }

            showToast(`Successfully added ${name} to queue!`);
            document.getElementById('student-name').value = '';
            document.getElementById('student-roll').value = '';
        }

        async function updateCourtStatus() {
            const staffId = document.getElementById('staff-id').value.trim();
            const sport = document.getElementById('staff-sport').value;
            const court = parseInt(document.getElementById('staff-court').value);
            const status = document.getElementById('status-update').value;

            if (!/^\d+$/.test(staffId)) {
                showToast("Please enter a valid numeric Staff ID.", true);
                return;
            }

            if (db) {
                const { error } = await db.from('sports_facilities')
                    .update({ availability: status })
                    .eq('sport_name', sport)
                    .eq('court_no', court);

                if (error) {
                    showToast("Update failed: " + error.message, true);
                    return;
                }
            } else {
                const item = facilities.find(f => f.sport_name === sport && f.court_no === court);
                if (item) item.availability = status;
                renderTables();
            }

            showToast(`Status updated to '${status}'!`);
        }

        async function admitNextInQueue() {
            const staffId = document.getElementById('staff-id').value.trim();
            const sport = document.getElementById('staff-sport').value;
            const court = parseInt(document.getElementById('staff-court').value);

            if (!/^\d+$/.test(staffId)) {
                showToast("Please enter a valid numeric Staff ID.", true);
                return;
            }

            const nextStudent = queue.find(q => q.sport_name === sport && q.court_no === court);
            if (nextStudent) {
                if (db) {
                    await db.from('court_queue').delete().eq('id', nextStudent.id);
                    await db.from('sports_facilities').update({ availability: 'FULL' }).eq('sport_name', sport).eq('court_no', court);
                } else {
                    const idx = queue.findIndex(q => q.sport_name === sport && q.court_no === court);
                    if (idx !== -1) queue.splice(idx, 1);
                    const item = facilities.find(f => f.sport_name === sport && f.court_no === court);
                    if (item) item.availability = 'FULL';
                    renderTables();
                }
                showToast(`Assigned to ${nextStudent.student_name}!`);
            } else {
                showToast("No students waiting in queue.", true);
            }
        }

        function setupRealtimeListener() {
            if (!db) return;
            db.channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public' }, () => {
                    fetchData();
                })
                .subscribe();
        }

        populateSportDropdowns();
        fetchData();
        setupRealtimeListener();
    </script>
</body>
</html>
